# Déploiement complet : base PostgreSQL + application/API.
#   cp server/.env.example .env   (puis remplir les mots de passe)
#   docker compose up -d --build
# Placer un reverse proxy HTTPS (Caddy, Nginx, Traefik…) devant le port 3000.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pousse
      POSTGRES_USER: pousse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
    volumes:
      - pousse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pousse -d pousse"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pousse:${POSTGRES_PASSWORD}@db:5432/pousse
      COOKIE_SECURE: "true"
      SESSION_DAYS: ${SESSION_DAYS:-30}
      APP_URL: ${APP_URL:?à définir dans .env (adresse publique de l'application)}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Pousse <no-reply@localhost>}
      # Rappel du soir (notifications push) : facultatif, voir server/README.md
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "127.0.0.1:3000:3000"   # exposé seulement au reverse proxy local

volumes:
  pousse-db:
